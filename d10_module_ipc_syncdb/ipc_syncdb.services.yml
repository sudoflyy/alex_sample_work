services:
  logger.channel.ipc_syncdb:
    class: Drupal\Core\Logger\LoggerChannel
    factory: logger.factory:get
    arguments: [ 'ipc_syncdb' ]

  ipc_syncdb.order_subscriber:
    class: Drupal\ipc_syncdb\EventSubscriber\OrderSubscriber
    arguments: [ '@entity_type.manager', '@config.factory', '@database' ]
    tags:
      - { name: event_subscriber }

  ipc_syncdb.transaction_manager:
    class: Drupal\ipc_syncdb\TransactionManager
    arguments: [ '@entity_type.manager', '@date.formatter', '@messenger', '@logger.channel.ipc_syncdb', '@config.factory', '@state', '@commerce_order.adjustment_transformer', '@ipc_syncdb.user_importer', '@ipc_syncdb.company_importer', '@commerce_payment.order_updater', '@ipc_syncdb.get_transaction_manager_logger', '@ipc_syncdb.invoice_price_splitter', '@ipc_syncdb.product_importer' ]

  ipc_syncdb.get_transaction_manager_logger:
    class: Drupal\ipc_syncdb\Logger\TransactionManagerLogger
    arguments: [ '@state' ]

  ipc_syncdb.product_importer:
    class: Drupal\ipc_syncdb\ProductImporter
    arguments: [ '@entity_type.manager', '@messenger', '@logger.channel.ipc_syncdb', '@state', '@config.factory', '@commerce_cart.cart_manager', '@database', '@current_user' ]

  ipc_syncdb.user_importer:
    class: Drupal\ipc_syncdb\UserImporter
    arguments: [ '@entity_type.manager', '@messenger', '@logger.channel.ipc_syncdb', '@ipc_syncdb.company_importer', '@state', '@config.factory', '@commerce_cart.cart_provider', '@current_user' ]

  ipc_syncdb.company_importer:
    class: Drupal\ipc_syncdb\CompanyImporter
    arguments: [ '@entity_type.manager', '@messenger', '@logger.channel.ipc_syncdb', '@state', '@config.factory', '@current_user' ]

  ipc_syncdb.license_importer:
    class: Drupal\ipc_syncdb\LicenseImporter
    arguments: [ '@entity_type.manager', '@logger.channel.ipc_syncdb', '@state', '@ipc_syncdb.user_importer', '@ipc_syncdb.company_importer', '@ipc_syncdb.product_importer', '@database' ]

  ipc_syncdb.invoice_price_splitter:
    class: Drupal\ipc_syncdb\InvoicePriceSplitter
    arguments: ['@entity_type.manager', '@commerce_price.rounder']

  commerce_email.email_subscriber:
    class: Drupal\ipc_syncdb\EventSubscriber\IpcEmailSubscriber
    arguments: ['@commerce_email.email_sender', '@plugin.manager.commerce_email_event', '@event_dispatcher', '@queue', '@module_handler', '@entity_type.manager']
    tags:
      - { name: event_subscriber }
