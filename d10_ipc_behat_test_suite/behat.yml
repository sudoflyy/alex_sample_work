default:
  autoload:
    - "%paths.base%/features/bootstrap"
  suites:
    default:
      failure_path: "%paths.base%/features/reports"
      paths:
        - "%paths.base%/features"
      contexts:
        - behat\features\bootstrap\FeatureContext
        - Drupal\DrupalExtension\Context\DrupalContext
        - Drupal\DrupalExtension\Context\MinkContext
        - Drupal\DrupalExtension\Context\MessageContext
        - Drupal\DrupalExtension\Context\DrushContext
        - Drupal\DrupalExtension\Context\ConfigContext
        - Drupal\DrupalExtension\Context\BatchContext
        - Drupal\DrupalExtension\Context\RandomContext
  extensions:
    Drupal\MinkExtension:
      base_url: http://ipcedge.lndo.site  # Lando env
      browser_name: chrome
      files_path: "%paths.base%/features/assets"
      ajax_timeout: 30
      goutte: ~
      default_session: s2
      sessions:
        s2:
          selenium2:
            browser: chrome
            wd_host: "http://selenium-node-chrome:4444/wd/hub"  # Lando env
            capabilities:
              browserName: chrome
              chrome:
                switches:
                  - "--disable-dev-shm-usage"
                  - "--no-sandbox"
                  - "--disable-web-security"
                  - "--allow-running-insecure-content"
                  - "--disable-site-isolation-trials"
                  #- "--start-fullscreen"
              version: "*"
    Drupal\DrupalExtension:
      blackbox: ~
      api_driver: 'drush'
      drupal:
        drupal_root: "%paths.base%/../../docroot"
      drush:
        alias: '@ipc.local'      # Lando env
        root: "%paths.base%/../../docroot"
        binary: "%paths.base%/../../vendor/bin/drush"
      region_map:
        header_top: ".site-header-top"
        header: ".site-header"
        content: ".site-content"
        footer: ".site-footer"
        breadcrumb: "nav.breadcrumb"
      text:
        username_field: 'Email'
        password_field: 'Password'
        # Use selector for log_in, not display text, because the page has two "Log In" links.
        log_in: 'edit-submit'
        log_out: "Log Out"
      selectors:
        message_selector: '.messages'
        error_message_selector: '.messages.error'
        success_message_selector: '.messages.status'
        warning_message_selector: '.messages.warning'

#    DrevOps\BehatScreenshotExtension:
#      dir: "%paths.base%/features/screenshots"
#      fail: true
#      fail_prefix: "failed_"
#      purge: false

gitlab_pipeline:
  extensions:
    Drupal\MinkExtension:
      base_url: 'http://127.0.0.1:8080'
